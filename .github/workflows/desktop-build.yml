name: Build desktop apps

# - On a normal push to the dev branch: build installers and upload them as
#   downloadable artifacts (for testing).
# - On a version tag (e.g. v1.0.1): build AND publish a GitHub Release with the
#   installers + auto-update metadata, which the app uses to update itself.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (uses the version in package.json)"
        type: boolean
        default: false
  push:
    branches:
      - claude/overlord-rpg-game-djt7dc
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the GitHub Release on tags

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (and publish a Release on version tags)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$FORCE_PUBLISH" == "true" || "$COMMIT_MSG" == *"[release]"* ]]; then PUB=always; else PUB=never; fi
          echo "Publish mode: $PUB"
          npx electron-builder --publish "$PUB"
        # Publishes a Release on: a v* tag, the manual "publish" input, or a
        # commit message containing [release]. COMMIT_MSG is passed via env to
        # avoid shell-injection from the commit text.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          FORCE_PUBLISH: ${{ github.event.inputs.publish }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}

      - name: Upload installer (test builds only)
        if: ${{ github.event.inputs.publish != 'true' && !startsWith(github.ref, 'refs/tags/') && !contains(github.event.head_commit.message, '[release]') }}
        uses: actions/upload-artifact@v4
        with:
          name: OverlordRPG-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
