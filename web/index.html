<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlord RPG — Nazarick Rising</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="scene" width="800" height="450"></canvas>

    <!-- Floating top bar (shown in town/battle) -->
    <div id="topbar" class="hidden">
      <span id="tb-name"></span>
      <span id="tb-level"></span>
      <span id="tb-hp"></span>
      <span id="tb-mp"></span>
      <span id="tb-gold"></span>
      <span id="tb-chapter"></span>
    </div>

    <button id="mute" title="Toggle sound">🔊</button>
    <button id="autobtn" class="hidden" title="Toggle auto-battle">🤖 Auto: OFF</button>

    <!-- UI overlay panels -->
    <div id="ui"></div>

    <!-- Battle action menu overlay -->
    <div id="battle-ui" class="hidden">
      <div id="log"></div>
      <div id="actions"></div>
      <div id="submenu" class="hidden"></div>
    </div>
  </div>
  <div id="footer">Overlord RPG — Nazarick Rising · a fan project · stylized procedural graphics</div>
</div>

<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/save.js"></script>
<script src="js/game.js"></script>
</body>
</html>
